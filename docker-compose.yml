# Production stack for a single VPS: app + MongoDB + Caddy (automatic HTTPS).
#
#   cp .env.production.example .env    # then fill it in
#   docker compose up -d --build
#
# Full guide: DEPLOY.md

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: moc-nhien-authentic:latest
    container_name: moc-nhien-app
    restart: unless-stopped
    # All application settings (JWT, bank account, SePay, Google Sheet, email…)
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Ho_Chi_Minh
      # One reverse-proxy hop (Caddy) — needed for correct client IPs in rate limiting
      TRUST_PROXY: "1"
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGO_DB:-moc-nhien}?authSource=admin
    # Not published on the host: only Caddy reaches it over the internal network.
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - moc-network
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongo:
    image: mongo:7
    container_name: moc-nhien-mongo
    restart: unless-stopped
    # Authentication is always on. No published port — never expose MongoDB to
    # the internet (Docker port mappings bypass ufw). For Compass, use an SSH
    # tunnel: see DEPLOY.md.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-moc-nhien}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mongo_data:/data/db
    networks:
      - moc-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    container_name: moc-nhien-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. shop.example.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - moc-network
    logging: *logging

volumes:
  mongo_data:
    name: moc-nhien-mongo-data
  caddy_data:
    name: moc-nhien-caddy-data
  caddy_config:
    name: moc-nhien-caddy-config

networks:
  moc-network:
    name: moc-network
    driver: bridge
